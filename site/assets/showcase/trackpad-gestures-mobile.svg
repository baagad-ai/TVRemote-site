<title id="tt">Trackpad gestures in The Remote</title><desc id="dd">Trackpad gestures in The Remote: tap for OK, swipe to move one step, long press for Long OK, two-finger tap for Back, two-finger swipe left to skip back, two-finger swipe right to skip forward, three-finger tap for Play/Pause, three-finger swipe up for Home.</desc>
