name: Validate landing page

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
      - "README.md"
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Use Node 24 for SQLite regression tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install the pinned site dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prerender pages and build the React runtime
        run: npm run build
      - name: Verify the static site
        run: |
          node --check site/config.js
          node --check site/build.mjs
          node site/check.mjs
          node site/check-config.mjs
          node --test site/beta-request.test.mjs worker/test/*.test.mjs

