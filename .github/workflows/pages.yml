name: Validate and deploy landing page

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
      - "README.md"
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Use Node 24 for SQLite regression tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install the pinned scene bundler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the optional Three.js scene
        run: npm run build:scene
      - name: Verify the static site
        run: |
          node --check site/site.js
          node --check site/config.js
          node --check site/build.mjs
          node site/check.mjs
          node site/check-config.mjs
          node --test site/beta-request.test.mjs worker/test/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install the pinned scene bundler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the optional Three.js scene
        run: npm run build:scene
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Stage the public page allowlist
        run: |
          mkdir _site
          cp site/index.html site/styles.css site/site.js site/config.js site/beta-request.js _site/
          cp -R site/assets site/privacy site/vendor _site/
          node site/build.mjs _site
      - name: Package the public site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
